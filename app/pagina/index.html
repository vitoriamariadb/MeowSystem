<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeowSystem</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="stylesheet" href="/paleta.css">
<link rel="stylesheet" href="/estilo.css">
<link rel="stylesheet" href="/tema.css">
<link rel="stylesheet" href="/manter.css">
<link rel="stylesheet" href="/oficina.css">
<link rel="stylesheet" href="/sons.css">
<link rel="stylesheet" href="/extensoes.css">
<link rel="stylesheet" href="/modificacoes.css">
</head>
<body data-token="@TOKEN@">

<a class="pular" href="#principal">Pular para o conteúdo</a>

<header class="topo" id="topo">
  <a class="marca" href="#tema" data-controle="marca">
    <img src="/logo.svg" alt="" width="30" height="30">
    <span>MeowSystem</span>
  </a>
  <nav aria-label="Portas"><ul class="portas" id="portas"></ul></nav>
  <div class="busca" id="caixa-busca" role="search">
    <button type="button" class="bt leve so-icone abrir-busca" id="abrir-busca" aria-label="Procurar um ajuste"
            data-controle="busca-abrir" data-dica="Procurar um ajuste">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    </button>
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="busca" type="search" placeholder="Procurar um ajuste" aria-label="Procurar um ajuste"
           autocomplete="off" data-controle="busca" aria-controls="achados" aria-expanded="false">
    <kbd aria-hidden="true">/</kbd>
    <div class="achados" id="achados" role="listbox" aria-label="Achados"></div>
  </div>
  <div class="aplicar" id="aplicar" data-n="0">
    <span class="gravando" id="gravando" role="status" data-estado="ok" aria-label="Gravado"><svg class="i so-ok" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><svg class="i so-erro" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg></span>
    <button type="button" class="conta" id="conta" aria-expanded="false" aria-controls="ultimas" data-controle="mudancas"></button>
    <button type="button" class="bt leve pequeno desfazer" id="desfazer" data-controle="descartar"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>Desfazer</button>
    <div class="menu-corpo ultimas" id="ultimas" role="list" aria-label="Últimas mudanças" hidden></div>
  </div>
  <details class="menu" id="menu">
    <summary class="bt leve pequeno so-icone" aria-label="Mais" data-controle="menu" data-dica="Mais">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>
    </summary>
    <div class="menu-corpo" id="menu-corpo" role="menu"></div>
  </details>
</header>

<nav class="abas-ajustes" id="abas" aria-label="Definir" hidden>
  <ul id="abas-lista"></ul>
  <div class="fila" id="abas-fila"></div>
</nav>

<main id="principal" class="pagina" tabindex="-1">
  <div id="conteudo" aria-busy="true">
    <div class="esqueleto-pagina" aria-hidden="true">
      <span class="esqueleto esqueleto-titulo"></span>
      <div class="esqueleto-grade"><span class="esqueleto"></span><span class="esqueleto"></span></div>
    </div>
  </div>
</main>

<div id="torradas" class="torradas" aria-live="polite"></div>
<div id="dica" class="dica" role="tooltip" hidden></div>

<dialog id="resultado" class="resultado" aria-labelledby="resultado-titulo">
  <div class="dentro">
    <header class="resultado-topo">
      <h2 id="resultado-titulo"></h2>
      <span class="fila">
        <span id="faixa-ensaio" class="estado-pilula" data-estado="ensaio" hidden>Ensaio</span>
        <span id="resultado-estado" class="estado-pilula"></span>
      </span>
    </header>
    <details class="registro" id="registro">
      <summary data-controle="resultado:registro">Registro</summary>
      <pre id="saida" tabindex="0" aria-live="polite"></pre>
    </details>
    <div class="acoes">
      <button type="button" class="bt perigo" id="parar" data-controle="resultado:parar">Parar</button>
      <button type="button" class="bt" id="resultado-restaurar" data-controle="resultado:restaurar" hidden>Restaurar</button>
      <button type="button" class="bt" id="resultado-guardar" data-controle="resultado:guardar"
              data-dica="Guarda o registro num arquivo">Guardar</button>
      <button type="button" class="bt" id="ensaio-rodar" data-controle="resultado:de-verdade" hidden>Rodar de verdade</button>
      <button type="button" class="bt principal" id="resultado-ok" data-controle="resultado:ok">OK</button>
    </div>
  </div>
</dialog>

<dialog id="pergunta" aria-labelledby="pergunta-titulo">
  <form method="dialog" class="dentro">
    <h2 id="pergunta-titulo"></h2>
    <div id="pergunta-corpo"></div>
    <div class="acoes">
      <button value="nao" class="bt" id="pergunta-nao" data-controle="pergunta:nao">Cancelar</button>
      <button value="seco" class="bt" id="confirmar-ensaio" data-controle="pergunta:ensaio" hidden
              data-dica="Mostra o que mudaria, sem gravar nada">Ver sem mudar</button>
      <button value="sim" class="bt principal" id="pergunta-sim" data-controle="pergunta:sim">OK</button>
    </div>
  </form>
</dialog>

<script src="/lugares.js"></script>
<script src="/mesa.js"></script>
<script src="/oficina.js"></script>
<script src="/paginas.js"></script>
<script src="/extensoes.js"></script>
<script src="/modificacoes.js"></script>
<script src="/logo-do-pack.js"></script>
<script src="/app.js"></script>
</body>
</html>
