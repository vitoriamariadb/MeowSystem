[package]
name = "meow-applet-leitura"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
rust-version = "1.93"
publish = false

[[bin]]
name = "meow-applet-leitura"
path = "src/main.rs"

[dependencies]
jiff = "0.2.35"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
rev = "1f6dc991eaa5115a09be2505cc8a323e5b2b0bff"
default-features = false
features = ["a11y", "applet", "wayland"]

[profile.release]
strip = true
