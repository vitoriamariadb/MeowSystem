name: testes

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

jobs:
  suite-portatil:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependências do tests/estilo.sh e do tests/flatpak-tema.sh
        run: sudo apt-get update && sudo apt-get install -y python3-numpy libglib2.0-bin libglib2.0-dev-bin

      - name: Rodar a suíte portátil
        run: ./tests/todos.sh --portatil
