name: testes

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  suite-portatil:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Os pacotes que o install traz, e os do tests/estilo.sh, do tests/flatpak-tema.sh, do tests/extensoes-install.sh e da suíte portátil
        run: sudo apt-get update && sudo apt-get install -y $(cut -f2 assets/pacotes/sistema.tsv) python3-numpy libglib2.0-bin libglib2.0-dev-bin imagemagick librsvg2-bin strace papirus-icon-theme just

      - name: Os forks das extensões, para o tests/extensoes-install.sh comparar o install de cada um com o pino
        run: |
          mkdir -p "$RUNNER_TEMP/forks"
          for pino in assets/extensoes/*.pino; do
            url="$(sed -n 's/^URL="\(.*\)"$/\1/p' "$pino")"
            [ -n "$url" ] || continue
            git clone --quiet "$url" "$RUNNER_TEMP/forks/$(basename "$url" .git)"
          done
          echo "EXTENSOES_FORKS=$RUNNER_TEMP/forks" >> "$GITHUB_ENV"

      - name: Rodar a suíte portátil, em que pulado é vermelho
        shell: bash
        run: |
          set -eo pipefail
          ./tests/todos.sh --portatil | tee "$RUNNER_TEMP/suite.log"
          if grep -q '^pulado' "$RUNNER_TEMP/suite.log"; then exit 1; fi
