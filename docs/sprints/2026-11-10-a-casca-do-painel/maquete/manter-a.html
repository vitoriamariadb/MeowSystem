<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manter, proposta A</title>
<style>
:root {
  --base: #1e1e2e; --mantle: #181825; --crust: #11111b;
  --surface0: #313244; --surface1: #45475a; --surface2: #585b70;
  --text: #cdd6f4; --subtext1: #bac2de; --subtext0: #a6adc8; --mauve: #cba6f7;
  --fundo: var(--base);
  --cartao: color-mix(in oklab, var(--surface0) 42%, var(--base));
  --linha: color-mix(in oklab, var(--surface1) 75%, var(--base));
  --linha-forte: var(--surface2);
  --tinta: var(--text); --tinta-2: var(--subtext1); --tinta-3: var(--subtext0);
  --accent: var(--mauve);
  --sobre-accent: var(--crust);
  --accent-suave: color-mix(in oklab, var(--accent) 15%, var(--fundo));
  --f-corpo: "Fira Sans", system-ui, sans-serif;
  --t-xs: .75rem; --t-sm: .8125rem; --t-md: .9375rem; --t-lg: 1.125rem; --t-xl: 1.5rem;
  --e-1: 4px; --e-2: 8px; --e-3: 12px; --e-4: 16px; --e-5: 20px; --e-6: 24px; --e-8: 32px;
  --raio-md: 12px; --raio-lg: 16px; --raio-pilula: 999px;
  --h-bt: 40px;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }
body { margin: 0; background: var(--fundo); color: var(--tinta); font: 400 var(--t-md)/1.5 var(--f-corpo); padding: var(--e-8) var(--e-4); }
main { max-width: 1100px; margin: 0 auto; }
h1, h2 { margin: 0; font-weight: 600; line-height: 1.15; letter-spacing: -.01em; overflow-wrap: anywhere; min-width: 0; }
h1 { font-size: var(--t-xl); margin-bottom: var(--e-6); }
h2 { font-size: var(--t-lg); }
svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.icone { display: grid; place-items: center; width: 44px; height: 44px; border-radius: var(--raio-md); background: var(--accent-suave); color: var(--accent); flex: none; }
.bt { display: inline-flex; align-items: center; justify-content: center; gap: var(--e-2); height: var(--h-bt); padding: 0 var(--e-5); border-radius: var(--raio-pilula); border: 1px solid var(--linha-forte); background: transparent; color: var(--tinta); font: 600 var(--t-md) var(--f-corpo); cursor: pointer; white-space: nowrap; transition: background 120ms cubic-bezier(.2,.8,.2,1); }
.bt:hover { background: var(--accent-suave); }
.bt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bt.principal { background: var(--accent); border-color: var(--accent); color: var(--sobre-accent); }
.bt.principal:hover { background: color-mix(in oklab, var(--accent) 85%, var(--text)); }

.lista { background: var(--cartao); border: 1px solid var(--linha); border-radius: var(--raio-lg); overflow: clip; }
.grupo { padding-bottom: var(--e-2); }
.grupo + .grupo { border-top: 1px solid var(--linha); }
.grupo > header { display: flex; align-items: center; gap: var(--e-3); padding: var(--e-4) var(--e-6) var(--e-2); }
.grupo > header h2 { font-size: var(--t-md); color: var(--tinta-2); }
.acao { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: var(--e-4); padding: var(--e-3) var(--e-6); min-height: 64px; }
.acao + .acao { border-top: 1px solid var(--linha); }
.acao b { font-weight: 600; }
.acao .bt { min-width: 168px; }
@media (max-width: 600px) { .acao { grid-template-columns: 1fr; } .acao .bt { width: 100%; } }
</style></head><body><main>
<h1>Manutenção</h1>
<section class="lista" aria-label="Ações de manutenção">
  <div class="grupo">
    <header><span class="icone"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></span><h2>Exportar</h2></header>
    <div class="acao"><b>Exportar ajustes</b><button class="bt" title="Grava seus ajustes num arquivo para levar a outro computador"><svg viewBox="0 0 24 24"><path d="M12 15V4M7 9l5-5 5 5M5 20h14"/></svg> Exportar</button></div>
    <div class="acao"><b>Importar ajustes</b><button class="bt" title="Lê um arquivo de ajustes exportado em outro computador"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg> Importar</button></div>
  </div>
  <div class="grupo">
    <header><span class="icone"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v5h-5"/></svg></span><h2>Atualizar</h2></header>
    <div class="acao"><b>Atualizar o sistema</b><button class="bt principal" title="Atualiza apt, flatpak e cargo, e depois verifica o sistema"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v5h-5"/></svg> Atualizar</button></div>
    <div class="acao"><b>Ver atualizações</b><button class="bt" title="Mostra o que a atualização mudaria, sem mudar nada"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg> Ver</button></div>
    <div class="acao"><b>Limpar pacotes velhos</b><button class="bt" title="Apaga pacotes que nada mais usa"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg> Limpar</button></div>
  </div>
  <div class="grupo">
    <header><span class="icone"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg></span><h2>Reinstalar</h2></header>
    <div class="acao"><b>Reinstalar o MeowSystem</b><button class="bt" title="Roda o instalador de novo, sem perder seus ajustes"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg> Reinstalar</button></div>
  </div>
</section>
</main></body></html>
