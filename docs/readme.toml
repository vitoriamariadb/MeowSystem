repositorio = "https://github.com/vitoriamariadb/MeowSystem"
casa = "https://github.com/vitoriamariadb/MeowSystem"

comandos = [
  "meow abrir",
  "meow doctor",
  "meow doctor --consertar",
  "meow pack",
  "meow pack info <id>",
  "meow desfazer",
  "meow log",
]

[portas.tema]
pt = "um cartão por pack: logo, paleta, o que é próprio e o que herda. Aplicar tema troca o pack."
en = "one card per pack: logo, palette, what it brings and what it inherits. Aplicar tema switches packs."

[portas.criar]
pt = "um pack seu, em passos: cores, ícones, papel de parede, sons, e baixar o tema."
en = "your own pack, step by step: colors, icons, wallpaper, sounds, and download the theme."

[portas.ajustes]
pt = "barra e dock, janelas, papel de parede, mascote, dia e noite e programas."
en = "bar and dock, windows, wallpaper, mascot, day and night and programs."

[portas.cuidar]
pt = "o doctor e o Consertar, a manutenção automática e os ajustes para levar a outra máquina."
en = "the doctor and its fix button, the automatic maintenance, and settings to carry to another machine."

[portas.extensoes]
pt = "os applets da casa e os de quem usa: instalar, atualizar, adicionar à barra, e os builds do compositor."
en = "the house applets and your own: install, update, add to the bar, and the compositor builds."

[portas.modificacoes]
pt = "um cartão por programa que recebe o tema: ligar, desligar, aplicar, e as correções de cada um."
en = "one card per program that takes the theme: turn on, turn off, apply, and each one's fixes."
